# LabB: mirror of ../lab-a -- same shape, own identity. Fully self-contained
# on its own; federation is opt-in via CA_URL + the `federated` profile.
#
# Static IPs on the coordination network, not hostnames -- see run_demo.sh.
services:
  intra-chain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    networks: [internal]

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5012:5001"   # http://localhost:5012/webui -- Kubo's built-in UI
    networks:
      internal:
      coordination:
        ipv4_address: 172.28.2.20

  app:
    build: ../app
    command: ["sleep", "infinity"]
    environment:
      - LAB_ID=LABB
      - CA_URL=${CA_URL:-}
      - INTRA_CHAIN_URL=http://intra-chain:8545
      - INTERLAB_CHAIN_URL=http://172.28.2.10:8545
      - IPFS_URL=http://ipfs:5001
      - IPFS_COORDINATION_IP=172.28.2.20
      - BESU_P2P_HOST=172.28.2.10
      - BESU_P2P_PORT=30303
    volumes:
      - lab-data:/data
      - besu-config:/besu-config
    depends_on: [intra-chain, ipfs]
    networks: [internal, coordination]

  # Read-only status page (published shares, chain/IPFS health, federation
  # state) -- http://localhost:9001. Never writes anything; just reads the
  # same files/endpoints node.py itself reads from.
  dashboard:
    build: ../app
    command: ["python3", "dashboard.py"]
    environment:
      - LAB_ID=LABB
      - CA_URL=${CA_URL:-}
      - INTRA_CHAIN_URL=http://intra-chain:8545
      - INTERLAB_CHAIN_URL=http://172.28.2.10:8545
      - IPFS_URL=http://ipfs:5001
    ports:
      - "9011:9000"
    volumes:
      - lab-data:/data
    depends_on: [intra-chain, ipfs]
    networks: [internal, coordination]

  besu:
    image: hyperledger/besu:latest
    profiles: [federated]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until [ -f /besu-config/genesis.json ]; do sleep 2; done &&
        exec besu --genesis-file=/besu-config/genesis.json --data-path=/besu-config
        --node-private-key-file=/besu-config/key.priv --rpc-http-enabled
        --rpc-http-host=0.0.0.0 --rpc-http-port=8545 --rpc-http-api=ETH,QBFT,NET
        --host-allowlist=* --p2p-host=172.28.2.10 --p2p-port=30303 --min-gas-price=0
    volumes:
      - besu-config:/besu-config
    networks:
      coordination:
        ipv4_address: 172.28.2.10

networks:
  internal:
  coordination:
    name: pkg-coordination
    external: true

volumes:
  lab-data:
  besu-config:
